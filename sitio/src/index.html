<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>Take-chan Ramen · Ramen Iekei en Tlaquepaque</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* Subconjuntos autohospedados (herramientas/fuentes.mjs). Rutas relativas a <base href>: sirven en / y en /Take-chan/. */
    @font-face { font-family: 'Shippori Mincho B1'; font-weight: 700; font-display: swap; src: url(fuentes/shippori-700.woff2) format('woff2'); }
    @font-face { font-family: 'Shippori Mincho B1'; font-weight: 800; font-display: swap; src: url(fuentes/shippori-800.woff2) format('woff2'); }
    @font-face { font-family: 'Geist'; font-weight: 400; font-display: swap; src: url(fuentes/geist-400.woff2) format('woff2'); }
    @font-face { font-family: 'Geist'; font-weight: 500; font-display: swap; src: url(fuentes/geist-500.woff2) format('woff2'); }
    @font-face { font-family: 'Geist'; font-weight: 600; font-display: swap; src: url(fuentes/geist-600.woff2) format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: swap; src: url(fuentes/geist-mono-500.woff2) format('woff2'); }
    /* Respaldos con el mismo ancho que las fuentes finales: el cambio de fuente no mueve el texto (CLS 0). */
    @font-face { font-family: 'Shippori respaldo'; src: local('Times New Roman'), local('Noto Serif'), local('DejaVu Serif'); size-adjust: 114%; ascent-override: 101.75%; descent-override: 25.4%; line-gap-override: 0%; }
    @font-face { font-family: 'Geist respaldo'; src: local('Arial'), local('Roboto'), local('Helvetica'); size-adjust: 102%; ascent-override: 99%; descent-override: 29.4%; line-gap-override: 0%; }
  </style>
  <script>
    /* Intro de la noren: solo la primera visita de la sesión y nunca con movimiento reducido. */
    (function () { try { if (!sessionStorage.getItem('take-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.documentElement.classList.add('con-intro'); sessionStorage.setItem('take-intro', '1'); setTimeout(function () { document.documentElement.classList.add('intro-saltada'); }, 1300); } } catch (e) {} })();
  </script>
  <style>
    #intro { display: none; }
    .con-intro #intro { display: block; position: fixed; inset: 0; z-index: 100; pointer-events: none; animation: intro-fin 1ms linear 1.2s forwards; }
    #intro .mitad { position: absolute; top: 0; bottom: 0; width: 50.5%; background: #1b1917; box-shadow: inset 0 0 120px rgba(0, 0, 0, .55); animation: 560ms cubic-bezier(.33, 1.3, .5, 1) .62s both; }
    #intro .izq { left: 0; border-right: 1px solid #262320; animation-name: intro-izq; transform-origin: 0 0; }
    #intro .der { right: 0; animation-name: intro-der; transform-origin: 100% 0; }
    #intro svg { position: absolute; left: 50%; top: 50%; width: min(34vw, 180px); translate: -50% -52%; overflow: visible; animation: intro-kanji 160ms ease .5s both; }
    #intro text { font: 800 160px/1 'Shippori Mincho B1', 'Yu Mincho', serif; fill: #f3eee4; fill-opacity: 0; stroke: #f3eee4; stroke-width: 2; stroke-dasharray: 3200; stroke-dashoffset: 3200; animation: intro-trazo 420ms cubic-bezier(.65, 0, .35, 1) .02s forwards, intro-tinta 200ms ease .3s forwards; }
    #intro button { position: absolute; right: 16px; bottom: 16px; pointer-events: auto; min-height: 44px; padding: 0 16px; border: 1px solid rgba(243, 238, 228, .45); border-radius: 6px; background: transparent; color: #f3eee4; font: 500 .875rem/1 'Geist', system-ui, sans-serif; cursor: pointer; animation: intro-kanji 200ms ease .6s both; }
    /* Saludo de toda ramen-ya al entrar: aparece cuando se abre la noren y se va antes del titular. */
    #intro .saludo { position: absolute; left: 50%; top: 50%; translate: -50% -50%; margin: 0; display: grid; justify-items: center; gap: 8px; color: #f3eee4; white-space: nowrap; opacity: 0; animation: intro-saludo 560ms ease .66s both; }
    #intro .saludo [lang] { font: 700 clamp(1.5rem, 5vw, 2.5rem)/1.2 'Shippori Mincho B1', 'Shippori respaldo', serif; letter-spacing: .08em; }
    #intro .saludo span:last-child { font: 500 .875rem/1 'Geist', 'Geist respaldo', sans-serif; letter-spacing: .12em; color: rgba(243, 238, 228, .75); }
    @keyframes intro-saludo { 0% { opacity: 0; transform: translateY(6px); } 25%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes intro-trazo { to { stroke-dashoffset: 0; } }
    @keyframes intro-tinta { to { fill-opacity: 1; } }
    @keyframes intro-kanji { to { opacity: 0; } }
    @keyframes intro-izq { to { transform: translateX(-102%) skewY(4deg); } }
    @keyframes intro-der { to { transform: translateX(102%) skewY(-4deg); } }
    @keyframes intro-fin { to { visibility: hidden; } }
    .intro-saltada #intro { display: none !important; }
  </style>
</head>
<body>
  <div id="intro">
    <div class="mitad izq"></div><div class="mitad der"></div>
    <svg viewBox="0 0 160 330" aria-hidden="true" focusable="false"><text x="0" y="140">家</text><text x="0" y="310">系</text></svg>
    <p class="saludo"><span lang="ja">いらっしゃいませ</span><span>Bienvenido</span></p>
    <button type="button" onclick="document.documentElement.classList.add('intro-saltada')">Saltar</button>
  </div>
  <app-root></app-root>
</body>
</html>
